version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories:
      - /TKNetUI
      - /tests/TKNetUI.Tests
      - /tests/TKNetUI.VisualChecks
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns:
          - Avalonia*
